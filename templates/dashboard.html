{% extends "base.html" %}

{% block content %}

<section class="panel">

    <h2><i class="fa-solid fa-user"></i> Donor Dashboard</h2>

    <div class="dashboard-card">

        <h3>Welcome, Donor!</h3>

        <p>Thank you for helping save lives.</p>

        <h3>Donor Information</h3>

        <p><i class="fa-solid fa-droplet"></i> Blood Group: Not Updated</p>
        <p><i class="fa-solid fa-location-dot"></i> Location: Not Updated</p>
        <p><i class="fa-solid fa-circle-check"></i> Availability: Available</p>

        <h3>Quick Actions</h3>

        <a href="/donor-register" class="primary-btn">
            <i class="fa-solid fa-user-plus"></i>
            Register as Donor
        </a>

        <a href="/view-donors" class="secondary-btn">
            <i class="fa-solid fa-users"></i>
            View Donors
        </a>

    </div>

</section>

{% endblock %}
