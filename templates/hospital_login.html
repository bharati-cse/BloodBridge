{% extends "base.html" %}
{% block content %}

<section class="panel narrow">
    <h2>Hospital Login (Demo)</h2>

    <p>
        Demo credentials:
        <code>hospital</code> / <code>1234</code>
    </p>

    <form method="post">

        <label>
            Username
            <input name="username" required>
        </label>

        <label>
            Password
            <input type="password" name="password" required>
        </label>

        <button type="submit">Login</button>

    </form>
</section>

{% endblock %}
