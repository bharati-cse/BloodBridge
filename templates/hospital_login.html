{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>🏥 Hospital Login</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="demo-login">
        Demo Login: <strong>hospital</strong> /
        <strong>1234</strong>
    </p>

</div>

{% endblock %}
