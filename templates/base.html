<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodBridge | Every Drop Counts</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header class="navbar">
    <a href="/" class="brand">
        <i class="fa-solid fa-droplet"></i>
        <span>BloodBridge</span>
    </a>

    <nav>
        <a href="/">
            <i class="fa-solid fa-house"></i> Home
        </a>

        <a href="/requirements">
            <i class="fa-solid fa-magnifying-glass"></i> Blood Requests
        </a>

        

        <a href="/hospital-login">
            <i class="fa-solid fa-hospital"></i> Hospital
        </a>

      
    </nav>
</header>

<main>
    <div class="flash-container">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash-message">
                    <i class="fa-solid fa-circle-check"></i>
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}
    </div>

    {% block content %}
    {% endblock %}
</main>

<footer>
    <i class="fa-solid fa-heart"></i>
    BloodBridge — Every Drop Counts. Every Life Matters.
</footer>

</body>
</html>
