{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>🩸 Blood Request Form</h2>

    <form method="POST">

        <label>Hospital Name</label>

        <input
            type="text"
            name="hospital_name"
            placeholder="Enter hospital name"
            required
        >

        <label>Blood Group Needed</label>

        <select name="blood_group" required>

            <option value="">Select Blood Group</option>

            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>

        </select>

        <label>Units Required</label>

        <input
            type="number"
            name="units"
            min="1"
            required
        >

        <label>Location</label>

        <input
            type="text"
            name="location"
            placeholder="Hospital location"
            required
        >

        <label>Contact Number</label>

        <input
            type="tel"
            name="contact"
            placeholder="Contact number"
            required
        >

        <button type="submit">
            Submit Blood Request
        </button>

    </form>

</div>

{% endblock %}
