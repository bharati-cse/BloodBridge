{% extends "base.html" %}
{% block content %}

<section class="panel">
    <h2>Create Blood Request</h2>

    <form method="post">

        <label>
            Hospital name
            <input name="hospital_name" required>
        </label>

        <label>
            Blood group
            <select name="blood_group" required>
                <option value="">Choose</option>
                {% for g in ["A+","A-","B+","B-","AB+","AB-","O+","O-"] %}
                    <option>{{ g }}</option>
                {% endfor %}
            </select>
        </label>

        <label>
            Units required
            <input type="number" name="units" min="1" required>
        </label>

        <label>
            City
            <input name="location" required>
        </label>

        <label>
            Contact (optional)
            <input name="contact">
        </label>

        <label>
            Request type
            <select name="request_type" required>
                <option>Normal</option>
                <option>Emergency</option>
            </select>
        </label>

        <button type="submit">Submit Request</button>

    </form>
</section>

{% endblock %}
