
<!DOCTYPE html>
<html>
<head>
    <title>Registered Donors - BloodBridge</title>
</head>
<body>

<h1>🩸 Registered Blood Donors</h1>

<form method="GET" action="/view-donors">
    <label>Search by Blood Group:</label>

    <select name="blood_group">
        <option value="">All Blood Groups</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>O+</option>
        <option>O-</option>
        <option>AB+</option>
        <option>AB-</option>
    </select>

    <button type="submit">Search Donors</button>
</form>

<br>


<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Blood Group</th>
        <th>Location</th>
    </tr>

    {% for donor in donors %}
    <tr>
        <td>{{ donor[0] }}</td>
        <td>{{ donor[1] }}</td>
        <td>{{ donor[2] }}</td>
        <td>{{ donor[3] }}</td>
    </tr>
    {% endfor %}

</table>

<br>
<a href="/hospital-dashboard">Back to Hospital Dashboard</a>

</body>
</html>
