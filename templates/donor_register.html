{% extends "base.html" %}
{% block content %}

<section class="panel">
    <h2>Donor Registration</h2>

    <form method="post">

        <label>
            Name
            <input name="name" required>
        </label>

        <label>
            Blood group
            <select name="blood_group" required>
                <option value="">Choose</option>
                {% for g in ["A+","A-","B+","B-","AB+","AB-","O+","O-"] %}
                    <option>{{ g }}</option>
                {% endfor %}
            </select>
        </label>

        <label>
            City
            <input name="location" required>
        </label>

        <label>
            Contact (optional)
            <input name="contact">
        </label>

        <button type="submit">Register</button>

    </form>
</section>

{% endblock %}
